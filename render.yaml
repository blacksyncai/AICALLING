# Render Blueprint — free tier. One web service runs the whole app
# (web UI + API + voice worker); one free Postgres database keeps your data.
#
# Deploy: Render dashboard → New → Blueprint → this repo → Apply, then paste the
# keys it asks for. Free instances sleep after ~15 idle minutes and take about a
# minute to wake on the next visit. For always-on calling, move closer to the
# paid plans (see README).
services:
  - type: web
    name: closer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: AUTH_EMAIL
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true
      - key: LIVEKIT_AGENT_NAME
        value: closer
      - key: DATABASE_URL
        fromDatabase:
          name: closer-db
          property: connectionString

databases:
  - name: closer-db
    plan: free
