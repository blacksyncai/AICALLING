# Render Blueprint — New → Blueprint → pick this repo. You'll be asked for the
# keys marked `sync: false`; everything else is wired up automatically.
envVarGroups:
  - name: closer-keys
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: CARTESIA_API_KEY
        sync: false
      - key: LIVEKIT_SIP_OUTBOUND_TRUNK_ID   # optional: phone calls + campaigns
        sync: false
      - key: LIVEKIT_AGENT_NAME
        value: closer
      - key: ENVIRONMENT
        value: production

services:
  # FastAPI backend (private to the web app + worker over Render's private network).
  - type: pserv
    name: closer-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - fromGroup: closer-keys
      - key: DATABASE_URL
        fromDatabase:
          name: closer-db
          property: connectionString

  # LiveKit voice worker — runs every browser and phone call.
  - type: worker
    name: closer-worker
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: python agent_worker.py start
    plan: starter
    envVars:
      - fromGroup: closer-keys
      - key: WEBHOOK_BASE_URL
        fromService:
          type: pserv
          name: closer-api
          property: hostport

  # The dashboard — this is the URL you open.
  - type: web
    name: closer-web
    runtime: node
    rootDir: web
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: BACKEND_ORIGIN
        fromService:
          type: pserv
          name: closer-api
          property: hostport
      - key: AUTH_EMAIL
        sync: false
      - key: AUTH_PASSWORD
        sync: false
      - key: AUTH_SECRET
        generateValue: true

databases:
  - name: closer-db
    plan: basic-256mb
