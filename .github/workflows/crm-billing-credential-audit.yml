name: CRM billing credential availability
on:
  push:
    branches: [codex/crm-billing-credential-audit]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check credential availability without revealing values
        env:
          STRIPE_KEY: ${{ secrets.STRIPE_SECRET_KEY || secrets.STRIPE_API_KEY || secrets.BILLING_STRIPE_API_KEY }}
          RAILWAY_KEY: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          python3 - <<'PY'
          import os,json
          key=os.environ.get('STRIPE_KEY','')
          print(json.dumps({'liveStripeKeyAvailable':key.startswith(('sk_live_','rk_live_')),'railwayAccessAvailable':bool(os.environ.get('RAILWAY_KEY'))}))
          PY
