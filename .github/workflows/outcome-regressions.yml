name: App regression checks

on:
  push:
    branches: [claude/determined-fermat-t1fn4e, feat/outcomes-brand-kits]
    paths:
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/outcome-regressions.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'web/**'
      - '.github/workflows/outcome-regressions.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - name: Compile modified runtime paths
        run: python -m compileall -q app/agent/runtime.py app/services/llm.py app/services/outbound_call.py agent_worker.py
      - name: Test outcomes and routing
        run: >-
          python -m pytest -q
          tests/test_voicemail_outcome_regressions.py
          tests/test_outcomes.py
          tests/test_voicemail_phrases.py
          tests/test_call_screener.py
          tests/test_contact_status_flow.py
          tests/test_campaign_rules.py
          tests/test_radar_automations.py
          tests/test_call_alerts.py
          tests/test_white_label.py
          tests/test_accounts.py
          tests/test_clerk.py
          tests/test_response_review.py
          tests/test_account_brand_kits.py
          tests/test_crm.py
          tests/test_fub_pipelines.py
          tests/test_call_date_range.py
          tests/test_connector_tools.py

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: node --experimental-strip-types --test src/lib/white-label-clerk.test.mjs src/lib/brand-theme.test.mjs
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
